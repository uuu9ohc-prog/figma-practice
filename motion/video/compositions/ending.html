  <script>
    function endBez(x1, y1, x2, y2) {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (u) => ((ax * u + bx) * u + cx) * u;
      const sy = (u) => ((ay * u + by) * u + cy) * u;
      return (t) => {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        let lo = 0, hi = 1, u = t;
        for (let i = 0; i < 40; i++) {
          if (sx(u) < t) lo = u; else hi = u;
          u = (lo + hi) / 2;
        }
        return sy(u);
      };
    }
    const OUT = endBez(0, 0, 0.2, 1);

    // 이 장면의 0초 = 영상 24초. S5 시각 = 24 + R1 시각
    const IN = endBez(0.4, 0, 1, 1);
    const tl = gsap.timeline({ paused: true });
    // S5 등장(24.0 ~ 24.65): 로고가 0.6 → 1배로 나타나고, 둘레에서 별 6개가 차례로 반짝임
    tl.fromTo("#end-logo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: OUT }, 0);
    for (let i = 1; i <= 6; i++) {
      const t = (i - 1) * 0.06;
      tl.fromTo("#end-star" + i, { opacity: 0, scale: 0, rotation: 0 }, { opacity: 1, scale: 1, rotation: 45, duration: 0.2, ease: OUT, immediateRender: false }, t);
      tl.to("#end-star" + i, { opacity: 0, scale: 0, rotation: 90, duration: 0.15, ease: IN }, t + 0.2);
    }
    tl.set("#end-w1", { opacity: 1 }, 1.2); // 25.2 (B: R1 1.2초)
    tl.set("#end-w2", { opacity: 1 }, 1.5); // 25.5 (B: R1 1.5초)
    tl.set("#end-w3", { opacity: 1 }, 1.7); // 25.7 (B: R1 1.7초)
    // 26.1 ~ 26.4 알약 상자 열림 (C: R1 2.1 ~ 2.4초)
    tl.fromTo(
      "#end-pill",
      { clipPath: "inset(0px 50% 0px 50% round 60px)" },
      { clipPath: "inset(0px 0% 0px 0% round 60px)", duration: 0.3, ease: OUT, immediateRender: false },
      2.1,
    );
    tl.set({}, {}, 6);

    window.__timelines["ending"] = tl;
