  <script>
    // motion.md 2-1 이징을 cubic-bezier 그대로 계산
    function phBez(x1, y1, x2, y2) {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (u) => ((ax * u + bx) * u + cx) * u;
      const sy = (u) => ((ay * u + by) * u + cy) * u;
      const dx = (u) => (3 * ax * u + 2 * bx) * u + cx;
      return (t) => {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        let u = t;
        for (let i = 0; i < 8; i++) {
          const e = sx(u) - t, d = dx(u);
          if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
          u -= e / d;
        }
        let lo = 0, hi = 1;
        if (Math.abs(sx(u) - t) > 1e-5) {
          u = t;
          for (let i = 0; i < 30; i++) {
            if (sx(u) < t) lo = u; else hi = u;
            u = (lo + hi) / 2;
          }
        }
        return sy(u);
      };
    }
    const OUT = phBez(0, 0, 0.2, 1);
    const IN = phBez(0.4, 0, 1, 1);
    const IO = phBez(0.4, 0, 0.2, 1);
    const BACK = phBez(0.34, 1.56, 0.64, 1);

    const tl = gsap.timeline({ paused: true });

    // 누르는 효과: 앞 절반 1 → 0.95, 뒤 절반 0.95 → 1 (ease-in-out)
    function press(sel, t, d) {
      tl.fromTo(sel, { scale: 1 }, { scale: 0.95, duration: d / 2, ease: IO, immediateRender: false }, t);
      tl.to(sel, { scale: 1, duration: d / 2, ease: IO }, t + d / 2);
    }
    function show(sel, t) { tl.set(sel, { display: "inline" }, t); }

    // 처음 상태
    tl.set(["#ph-icon1", "#ph-icon2", "#ph-icon3", "#ph-icon4", "#ph-icon5", "#ph-icon6", "#ph-icon7", "#ph-icon8"], { opacity: 0, y: 24 }, 0);

    // ----- S1 (0 ~ 6) -----
    // S1 등장: 오른쪽 화면 밖에서 들어온 뒤(0 ~ 0.5) 통통 두 번 튐(0.5 ~ 0.92)
    tl.fromTo("#ph-frame", { x: 1080, y: 0, opacity: 1 }, { x: 0, duration: 0.5, ease: OUT }, 0);
    tl.to("#ph-frame", { y: -48, duration: 0.12, ease: OUT }, 0.5);
    tl.to("#ph-frame", { y: 0, duration: 0.12, ease: IN }, 0.62);
    tl.to("#ph-frame", { y: -20, duration: 0.09, ease: OUT }, 0.74);
    tl.to("#ph-frame", { y: 0, duration: 0.09, ease: IN }, 0.83);
    for (let i = 1; i <= 8; i++) {
      tl.fromTo("#ph-icon" + i, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.1, ease: OUT, immediateRender: false }, 0.6 + (i - 1) * 0.1);
    }
    tl.fromTo("#ph-sbox", { scale: 1 }, { scale: 1.08, duration: 0.4, ease: IO }, 1.6);
    tl.to("#ph-sbox", { scale: 1, duration: 0.4, ease: IO }, 2.0);
    tl.set("#ph-s1-hint-off", { opacity: 1 }, 3.6);
    show("#ph-s1-c1", 3.7); show("#ph-s1-c2", 3.9); show("#ph-s1-c3", 4.1); show("#ph-s1-c4", 4.3);
    // 커서: 입력하는 동안은 계속 켜 두고, 끝난 뒤 0.5초마다 켜짐/꺼짐
    tl.set("#ph-s1-cursor", { opacity: 1 }, 3.6);
    tl.set("#ph-s1-cursor", { opacity: 0 }, 4.8);
    tl.set("#ph-s1-cursor", { opacity: 1 }, 5.3);
    tl.set("#ph-s1-cursor", { opacity: 0 }, 5.6);
    tl.fromTo("#ph-mag", { scale: 1 }, { scale: 0.95, duration: 0.1, ease: IO, immediateRender: false }, 5.6);
    tl.to("#ph-mag", { scale: 1.25, duration: 0.1, ease: OUT }, 5.7);

    // ----- S1 → S2 (6.0 ~ 6.3): `검색` 화면이 검색창을 기준으로 한 번에 커지며 등장 -----
    // 기준점 = `검색` 화면 입력창 가운데 (Figma x 215, y 213 → 휴대폰 안 484, 63)
    tl.fromTo("#ph-s1", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: IO, immediateRender: false }, 6.0);
    tl.fromTo(
      ["#ph-s2", "#ph-s2-type"],
      { opacity: 0, scale: 0, transformOrigin: "484px 63px" },
      { opacity: 1, scale: 1, transformOrigin: "484px 63px", duration: 0.3, ease: OUT, immediateRender: false },
      6.0,
    );

    // ----- S2 (6 ~ 14) -----
    tl.set("#ph-s2-hint-off", { opacity: 1 }, 6.4);
    tl.set("#ph-s2-cursor", { opacity: 1 }, 6.4);
    [6.5, 6.7, 6.9, 7.1, 7.3, 7.5].forEach((t, i) => show("#ph-s2-c" + (i + 1), t));
    tl.set("#ph-s2-cursor", { opacity: 0 }, 8.0);
    press("#ph-sbtn", 8.0, 0.2);
    tl.fromTo("#ph-ripple", { scale: 0, opacity: 0.4 }, { scale: 1, opacity: 0, duration: 0.5, ease: OUT, immediateRender: false }, 8.0);
    tl.fromTo("#ph-res", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IO, immediateRender: false }, 8.5);
    tl.set(["#ph-badge", "#ph-rbtn-bg", "#ph-rbtn"], { opacity: 1 }, 8.5);
    tl.set(["#ph-card1", "#ph-card2", "#ph-card3", "#ph-card4"], { opacity: 0, y: 24 }, 0);
    [8.8, 8.95, 9.1, 9.25].forEach((t, i) => {
      tl.fromTo("#ph-card" + (i + 1), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: OUT, immediateRender: false }, t);
    });
    // 배지·예약 버튼은 카드 1과 함께 나타남
    tl.fromTo(["#ph-badge", "#ph-rbtn-bg", "#ph-rbtn"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: OUT, immediateRender: false }, 8.8);
    tl.fromTo("#ph-badge", { scale: 1 }, { scale: 1.1, duration: 0.2, ease: IO, immediateRender: false }, 10.4);
    tl.to("#ph-badge", { scale: 1, duration: 0.2, ease: IO }, 10.6);

    // ----- S3 (14 ~ 18.1) -----
    press("#ph-rbtn", 14.5, 0.3);
    tl.fromTo("#ph-dim", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: OUT, immediateRender: false }, 14.8);
    tl.fromTo("#ph-popup", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: OUT, immediateRender: false }, 15.0);
    press("#ph-confirm", 17.8, 0.3);

    // ----- S3 → S4 (18.1 ~ 18.8): 그라데이션 원 퍼짐 -----
    tl.to(["#ph-popup", "#ph-dim"], { opacity: 0, duration: 0.1, ease: IN }, 18.1);
    tl.fromTo("#ph-burst", { scale: 0, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.4, ease: IO, immediateRender: false }, 18.1);
    tl.set(["#ph-s2", "#ph-res", "#ph-s2-type"], { opacity: 0 }, 18.5);
    tl.set("#ph-s4", { opacity: 1 }, 18.5);
    tl.to("#ph-burst", { opacity: 0, duration: 0.3, ease: IO }, 18.5);

    // ----- S4 (18.1 ~ 24) -----
    tl.fromTo("#ph-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: OUT }, 19.0);
    tl.fromTo("#ph-done-badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: BACK, immediateRender: false }, 19.6);
    // 23.4부터 덮개(cover)가 밑줄 자리에서 이어받음
    tl.set("#ph-hl", { opacity: 0 }, 23.4);
    tl.set({}, {}, 24);

    window.__timelines["phone"] = tl;
  </script>
